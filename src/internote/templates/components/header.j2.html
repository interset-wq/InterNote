{# Site header component - expects: site, icons, i18n #}
<div class="in-site-branding">
  <img src="{{ site.avatar_url }}" class="in-site-avatar" alt="{{ site.title }} avatar">
  <a class="in-site-title" href="{{ site.home_url }}">{{ site.display_title }}</a>
</div>
<nav class="in-site-nav" aria-label="Site navigation">
  {% block nav_items %}{% endblock %}
</nav>
