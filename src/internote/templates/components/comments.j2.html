{# Comments section - expects: site, i18n, post.
   giscus.app is slow on high-latency networks (client.js alone is
   1.3s TTFB cross-border), so the script ships inside an inert
   <template> and plugins/giscus.js materialises it only when the
   reader approaches the section (IntersectionObserver, 300px
   rootMargin; immediate load as the fallback). #}
<section class="in-comments-section">
  <template id="in-giscus-template">
    <script src="https://giscus.app/client.js"
      data-repo="{{ site.giscus_repo }}"
      data-repo-id="{{ site.giscus_repo_id }}"
      data-category="{{ site.giscus_category }}"
      data-category-id="{{ site.giscus_category_id }}"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="zh-CN"
      crossorigin="anonymous"
      async></script>
  </template>
  <div class="in-comments-container" id="comments"></div>
</section>
