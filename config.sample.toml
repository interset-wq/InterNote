# InterNote 配置文件（config.toml）
# 复制为 config.toml 后按需修改

[site]
title = "InterNote"
sub_title = "My notes on everything"
avatar_url = "https://github.githubassets.com/favicons/favicon.svg"
# home_url = ""             # 留空则自动推导（GitHub Pages 地址）
language = "CN"              # CN | EN
utc = 8                      # 时区偏移（小时）

[layout]
posts_per_page = 15
single_labels = []           # 单页标签（如 ["about"]）
# start_date = ""           # 建站日期（如 "2026-01-01"）
# icp = ""                  # ICP 备案号
# footer_text = ""          # 文章页底部附加文字

[comments]
enabled = true

[giscus]
repo = ""                    # 如 "your-name/your-blog"
repo_id = ""                 # giscus.app 提供
category = ""                # 如 "Announcements"
category_id = ""             # giscus.app 提供

[search]
# Algolia 凭据。app_id / api_key 在 Algolia 控制台的 API keys 页面获取。
# api_key 只放 Search-only key —— 它本来就要暴露给浏览器，可以安全提交。
# 写入索引用的 admin key 不写在这里，而是通过环境变量 ALGOLIA_ADMIN_KEY
# 传给构建流程（GitHub Actions 里配成 Secret）。
app_id = ""                    # 如 "ABCD1234"
api_key = ""                   # Search-only API key
index_name = ""                # 如 "posts"

[features]
visit_counter = "off"        # off | vercount | busuanzi
search = "off"               # off | algolia
